<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GLOBOS browser-based restaurant POS">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GLOBOS POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GLOBOS POS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #F5F7FA;
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }

    @supports (height: 100dvh) {
      html,
      body {
        height: 100dvh;
      }
    }
  </style>
</head>
<body>
  <script>
    (() => {
      const path = window.location.pathname;
      if (
        /^\/order\/[a-z0-9][a-z0-9-]{2,62}$/.test(path) &&
        !window.location.hash
      ) {
        window.history.replaceState(
          null,
          '',
          '/#' + path + window.location.search,
        );
      }
    })();

    (() => {
      let digitalReceiptToken = '';
      if (window.location.pathname === '/receipt') {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const candidate = fragment.get('token') || '';
        if (/^[A-Za-z0-9_-]{32}$/.test(candidate)) {
          digitalReceiptToken = candidate;
        }
        // The fragment is not sent to the server or Referer. Remove it from
        // browser history before Flutter, analytics, or error handlers start.
        window.history.replaceState(null, '', '/#/receipt');
      }
      window.globosTakeDigitalReceiptToken = () => {
        const token = digitalReceiptToken;
        digitalReceiptToken = '';
        return token;
      };
    })();

    (() => {
      const outboxDbName = 'globos-pos-emergency';
      const outboxStoreName = 'progress-outbox';

      function openOutbox() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(outboxDbName, 1);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(outboxStoreName)) {
              db.createObjectStore(outboxStoreName, { keyPath: 'id' });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      const emergencyVoiceSupported = () =>
        'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
      let emergencyVoiceLastQueuedAt = 0;
      let emergencyVietnameseVoice = null;
      let emergencyVietnameseVoicePromise = null;

      function refreshEmergencyVietnameseVoice() {
        if (!emergencyVoiceSupported()) return null;
        const voices = window.speechSynthesis.getVoices();
        emergencyVietnameseVoice = voices.find((voice) =>
          String(voice.lang || '').toLowerCase() === 'vi-vn'
        ) || voices.find((voice) =>
          String(voice.lang || '').toLowerCase().startsWith('vi')
        ) || null;
        return emergencyVietnameseVoice;
      }

      function waitForEmergencyVietnameseVoice() {
        const availableVoice = refreshEmergencyVietnameseVoice();
        if (availableVoice) return Promise.resolve(availableVoice);
        if (emergencyVietnameseVoicePromise) return emergencyVietnameseVoicePromise;

        emergencyVietnameseVoicePromise = new Promise((resolve) => {
          let attemptsRemaining = 15;
          const poll = () => {
            const voice = refreshEmergencyVietnameseVoice();
            if (voice || attemptsRemaining <= 0) {
              resolve(voice);
              return;
            }
            attemptsRemaining -= 1;
            window.setTimeout(poll, 100);
          };
          poll();
        }).finally(() => {
          emergencyVietnameseVoicePromise = null;
        });
        return emergencyVietnameseVoicePromise;
      }

      function queueEmergencyVietnameseSpeech(normalized, vietnameseVoice) {
        const now = Date.now();
        if (now - emergencyVoiceLastQueuedAt > 1500 &&
            (window.speechSynthesis.speaking || window.speechSynthesis.pending)) {
          window.speechSynthesis.cancel();
        }
        emergencyVoiceLastQueuedAt = now;
        const utterance = new SpeechSynthesisUtterance(normalized);
        utterance.lang = 'vi-VN';
        // Some tablet browsers can synthesize vi-VN even when getVoices()
        // does not expose the system voice. Keep the language-only fallback
        // audible instead of silently dropping the announcement.
        if (vietnameseVoice) utterance.voice = vietnameseVoice;
        utterance.rate = 0.92;
        utterance.pitch = 1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
        window.setTimeout(resumeEmergencyVoice, 25);
        window.setTimeout(resumeEmergencyVoice, 250);
        return true;
      }

      function resumeEmergencyVoice() {
        if (!emergencyVoiceSupported()) return false;
        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          return true;
        } catch (_) {
          return false;
        }
      }

      window.globosEmergencyVoiceEnable = () => {
        if (!resumeEmergencyVoice()) return false;
        try {
          const vietnameseVoice = refreshEmergencyVietnameseVoice();
          // Mobile Safari and tablet Chrome require a real speech request from
          // the button gesture before later realtime callbacks may speak.
          const unlock = new SpeechSynthesisUtterance('\u00a0');
          unlock.lang = 'vi-VN';
          if (vietnameseVoice) unlock.voice = vietnameseVoice;
          unlock.rate = 10;
          unlock.volume = 0.01;
          window.speechSynthesis.speak(unlock);
          window.setTimeout(resumeEmergencyVoice, 50);
          return true;
        } catch (_) {
          return false;
        }
      };

      window.globosEmergencyVoiceSpeak = (message) => {
        if (!resumeEmergencyVoice()) return false;
        const normalized = String(message || '').trim();
        if (!normalized) return false;
        try {
          waitForEmergencyVietnameseVoice().then((vietnameseVoice) => {
            queueEmergencyVietnameseSpeech(normalized, vietnameseVoice);
          }).catch(() => {});
          return true;
        } catch (_) {
          return false;
        }
      };

      if (emergencyVoiceSupported()) {
        refreshEmergencyVietnameseVoice();
        window.speechSynthesis.addEventListener(
          'voiceschanged',
          refreshEmergencyVietnameseVoice,
        );
      }

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') resumeEmergencyVoice();
      });

      window.globosEmergencyOutboxPut = async (id, payload) => {
        const db = await openOutbox();
        await new Promise((resolve, reject) => {
          const request = db.transaction(outboxStoreName, 'readwrite')
            .objectStore(outboxStoreName).put({ id, payload, createdAt: Date.now() });
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
        db.close();
      };

      window.globosEmergencyOutboxReadAll = async () => {
        const db = await openOutbox();
        const records = await new Promise((resolve, reject) => {
          const request = db.transaction(outboxStoreName, 'readonly')
            .objectStore(outboxStoreName).getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
        db.close();
        records.sort((left, right) => (left.createdAt || 0) - (right.createdAt || 0));
        return JSON.stringify(records);
      };

      window.globosEmergencyOutboxDelete = async (id) => {
        const db = await openOutbox();
        await new Promise((resolve, reject) => {
          const request = db.transaction(outboxStoreName, 'readwrite')
            .objectStore(outboxStoreName).delete(id);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
        db.close();
      };

      window.globosEmergencyConfigurePushWorker = async (configJson) => {
        if (!('serviceWorker' in navigator)) return false;
        await navigator.serviceWorker.register('/firebase-messaging-sw.js');
        const registration = await navigator.serviceWorker.ready;
        const worker = registration.active;
        if (!worker) return false;
        worker.postMessage({ type: 'GLOBOS_FIREBASE_CONFIG', config: JSON.parse(configJson) });
        return true;
      };
    })();

    (() => {
      let googleMapsLoadPromise = null;
      window.globosLoadGoogleMaps = (rawKey) => {
        const key = String(rawKey || '').trim();
        if (!key) return Promise.reject(new Error('GOOGLE_MAPS_KEY_MISSING'));
        if (window.google && window.google.maps) return Promise.resolve(true);
        if (googleMapsLoadPromise) return googleMapsLoadPromise;

        googleMapsLoadPromise = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://maps.googleapis.com/maps/api/js?key=' +
            encodeURIComponent(key) +
            '&loading=async&libraries=maps,marker&auth_referrer_policy=origin';
          script.async = true;
          script.defer = true;
          script.referrerPolicy = 'origin';
          script.onload = () => resolve(true);
          script.onerror = () => {
            googleMapsLoadPromise = null;
            reject(new Error('GOOGLE_MAPS_LOAD_FAILED'));
          };
          document.head.appendChild(script);
        });
        return googleMapsLoadPromise;
      };
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

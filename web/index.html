<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GLOBOS browser-based restaurant POS">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GLOBOS POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GLOBOS POS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #F5F7FA;
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }

    @supports (height: 100dvh) {
      html,
      body {
        height: 100dvh;
      }
    }
  </style>
</head>
<body>
  <script>
    (() => {
      let digitalReceiptToken = '';
      if (window.location.pathname === '/receipt') {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const candidate = fragment.get('token') || '';
        if (/^[A-Za-z0-9_-]{32}$/.test(candidate)) {
          digitalReceiptToken = candidate;
        }
        // The fragment is not sent to the server or Referer. Remove it from
        // browser history before Flutter, analytics, or error handlers start.
        window.history.replaceState(null, '', '/#/receipt');
      }
      window.globosTakeDigitalReceiptToken = () => {
        const token = digitalReceiptToken;
        digitalReceiptToken = '';
        return token;
      };
    })();

    (() => {
      let emergencyAudioContext = null;
      const outboxDbName = 'globos-pos-emergency';
      const outboxStoreName = 'progress-outbox';

      function openOutbox() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(outboxDbName, 1);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(outboxStoreName)) {
              db.createObjectStore(outboxStoreName, { keyPath: 'id' });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      window.globosEmergencyAlarmEnable = () => {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return false;
        emergencyAudioContext ||= new AudioContext();
        if (emergencyAudioContext.state === 'suspended') {
          emergencyAudioContext.resume();
        }
        return true;
      };

      window.globosEmergencyAlarmPlay = () => {
        if (!emergencyAudioContext || emergencyAudioContext.state !== 'running') return;
        const start = emergencyAudioContext.currentTime;
        [0, 0.18, 0.36].forEach((offset, index) => {
          const oscillator = emergencyAudioContext.createOscillator();
          const gain = emergencyAudioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.value = index === 1 ? 1046 : 880;
          gain.gain.setValueAtTime(0.0001, start + offset);
          gain.gain.exponentialRampToValueAtTime(0.22, start + offset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + offset + 0.14);
          oscillator.connect(gain).connect(emergencyAudioContext.destination);
          oscillator.start(start + offset);
          oscillator.stop(start + offset + 0.15);
        });
      };

      window.globosEmergencyOutboxPut = async (id, payload) => {
        const db = await openOutbox();
        await new Promise((resolve, reject) => {
          const request = db.transaction(outboxStoreName, 'readwrite')
            .objectStore(outboxStoreName).put({ id, payload, createdAt: Date.now() });
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
        db.close();
      };

      window.globosEmergencyOutboxReadAll = async () => {
        const db = await openOutbox();
        const records = await new Promise((resolve, reject) => {
          const request = db.transaction(outboxStoreName, 'readonly')
            .objectStore(outboxStoreName).getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
        db.close();
        records.sort((left, right) => (left.createdAt || 0) - (right.createdAt || 0));
        return JSON.stringify(records);
      };

      window.globosEmergencyOutboxDelete = async (id) => {
        const db = await openOutbox();
        await new Promise((resolve, reject) => {
          const request = db.transaction(outboxStoreName, 'readwrite')
            .objectStore(outboxStoreName).delete(id);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
        db.close();
      };

      window.globosEmergencyConfigurePushWorker = async (configJson) => {
        if (!('serviceWorker' in navigator)) return false;
        await navigator.serviceWorker.register('/firebase-messaging-sw.js');
        const registration = await navigator.serviceWorker.ready;
        const worker = registration.active;
        if (!worker) return false;
        worker.postMessage({ type: 'GLOBOS_FIREBASE_CONFIG', config: JSON.parse(configJson) });
        return true;
      };
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

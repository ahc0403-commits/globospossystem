name: Photo Objet Sales Collect Prepare

on:
  schedule:
    # Start preparing at 21:40 HCM. The runner waits on the DB clock and the
    # actual collection lease cannot be acquired before 22:00 HCM.
    - cron: '40 14 * * *'
permissions:
  contents: read
  issues: write

jobs:
  collect:
    uses: ./.github/workflows/photo_objet_sales_collect_runner.yml
    with:
      executor_role: primary
      trigger_cron: ${{ github.event.schedule }}
    secrets: inherit

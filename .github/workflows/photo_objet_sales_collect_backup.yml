name: Photo Objet Sales Collect Backup Prepare

on:
  schedule:
    # Independent prepared backup. It cannot take the DB lease before 22:01 HCM.
    - cron: '50 14 * * *'
permissions:
  contents: read
  issues: write

jobs:
  collect:
    uses: ./.github/workflows/photo_objet_sales_collect_runner.yml
    with:
      executor_role: backup
      trigger_cron: ${{ github.event.schedule }}
    secrets: inherit

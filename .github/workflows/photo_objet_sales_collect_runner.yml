name: Photo Objet Prepared Collector Runner

on:
  workflow_call:
    inputs:
      executor_role:
        required: true
        type: string
      trigger_cron:
        required: true
        type: string
      slot_date_hcm:
        required: false
        type: string
        default: ''
      full_day_finalize:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PHOTO_OBJET_SCHEDULED: 'true'
      PHOTO_OBJET_SCHEDULE_CRON: ${{ inputs.trigger_cron }}
      PHOTO_OBJET_TARGET_SLOT_TIME_HCM: '22:00'
      PHOTO_OBJET_SLOT_DATE_HCM: ${{ inputs.slot_date_hcm }}
      PHOTO_OBJET_FULL_DAY_FINALIZE: ${{ inputs.full_day_finalize }}
      PHOTO_OBJET_EXECUTOR_ROLE: ${{ inputs.executor_role }}
      PHOTO_OBJET_PARALLELISM: '3'
      PHOTO_OBJET_INCLUDE_YESTERDAY: 'false'
      MOERS_BIENHOA_USER: tob009
      MOERS_BIENHOA_PASS: ${{ secrets.MOERS_BIENHOA_PASS }}
      PHOTO_OBJET_BIENHOA_STORE_ID: ${{ secrets.PHOTO_OBJET_BIENHOA_STORE_ID }}
      PHOTO_OBJET_BIENHOA_ENABLED: ${{ vars.PHOTO_OBJET_BIENHOA_ENABLED }}
      MOERS_DIAN_USER: tob024
      MOERS_DIAN_PASS: ${{ secrets.MOERS_DIAN_PASS }}
      PHOTO_OBJET_DIAN_STORE_ID: ${{ secrets.PHOTO_OBJET_DIAN_STORE_ID }}
      PHOTO_OBJET_DIAN_ENABLED: ${{ vars.PHOTO_OBJET_DIAN_ENABLED }}
      MOERS_LONGTHANH_USER: tob025
      MOERS_LONGTHANH_PASS: ${{ secrets.MOERS_LONGTHANH_PASS }}
      PHOTO_OBJET_LONGTHANH_STORE_ID: ${{ secrets.PHOTO_OBJET_LONGTHANH_STORE_ID }}
      PHOTO_OBJET_LONGTHANH_ENABLED: ${{ vars.PHOTO_OBJET_LONGTHANH_ENABLED }}
      MOERS_THAODIEN_USER: tob029
      MOERS_THAODIEN_PASS: ${{ secrets.MOERS_THAODIEN_PASS }}
      PHOTO_OBJET_THAODIEN_STORE_ID: ${{ secrets.PHOTO_OBJET_THAODIEN_STORE_ID }}
      PHOTO_OBJET_THAODIEN_ENABLED: ${{ vars.PHOTO_OBJET_THAODIEN_ENABLED }}
      MOERS_QUANGTRUNG_USER: tob030
      MOERS_QUANGTRUNG_PASS: ${{ secrets.MOERS_QUANGTRUNG_PASS }}
      PHOTO_OBJET_QUANGTRUNG_STORE_ID: ${{ secrets.PHOTO_OBJET_QUANGTRUNG_STORE_ID }}
      PHOTO_OBJET_QUANGTRUNG_ENABLED: ${{ vars.PHOTO_OBJET_QUANGTRUNG_ENABLED }}
      MOERS_NOWZONE_USER: tob049
      MOERS_NOWZONE_PASS: ${{ secrets.MOERS_NOWZONE_PASS }}
      PHOTO_OBJET_NOWZONE_STORE_ID: ${{ secrets.PHOTO_OBJET_NOWZONE_STORE_ID }}
      PHOTO_OBJET_NOWZONE_ENABLED: ${{ vars.PHOTO_OBJET_NOWZONE_ENABLED }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Initialize prepared runtime
        run: |
          echo "PHOTO_OBJET_RUN_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"
          echo "PUPPETEER_CACHE_DIR=/home/runner/.cache/puppeteer" >> "${GITHUB_ENV}"
          if [ "${PHOTO_OBJET_FULL_DAY_FINALIZE}" = 'true' ]; then
            business_date=$(TZ=Asia/Ho_Chi_Minh date --date='yesterday' +'%Y-%m-%d')
            echo "PHOTO_OBJET_BUSINESS_DATE_HCM=${business_date}" >> "${GITHUB_ENV}"
          fi
      - name: Restore pinned Chromium cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.cache/puppeteer
          key: ${{ runner.os }}-photo-puppeteer-${{ hashFiles('scripts/package-lock.json') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install locked dependencies before 22:00
        working-directory: scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci
      - name: Restore or install pinned Chromium before 22:00
        working-directory: scripts
        run: |
          CHROME_VERSION=$(node -p "require('puppeteer').PUPPETEER_REVISIONS.chrome")
          npx puppeteer browsers install "chrome@${CHROME_VERSION}"
          CHROME_PATH=$(node -e "Promise.resolve(require('puppeteer').executablePath()).then(console.log)")
          test -x "${CHROME_PATH}"
          echo "PUPPETEER_EXECUTABLE_PATH=${CHROME_PATH}" >> "${GITHUB_ENV}"
      - name: Preflight prepared collector and POS target
        working-directory: scripts
        run: |
          if [ "${PHOTO_OBJET_FULL_DAY_FINALIZE}" = 'true' ]; then
            node pull_moers_sales.js --preflight-only \
              --backfill-from "${PHOTO_OBJET_BUSINESS_DATE_HCM}" \
              --backfill-to "${PHOTO_OBJET_BUSINESS_DATE_HCM}"
          else
            node pull_moers_sales.js --preflight-only
          fi
      - name: Collect the scheduled slot or finalize the prior HCM day
        working-directory: scripts
        run: |
          if [ "${PHOTO_OBJET_FULL_DAY_FINALIZE}" = 'true' ]; then
            node pull_moers_sales.js \
              --backfill-from "${PHOTO_OBJET_BUSINESS_DATE_HCM}" \
              --backfill-to "${PHOTO_OBJET_BUSINESS_DATE_HCM}" --execute
          else
            node pull_moers_sales.js
          fi
      - name: Escalate collection execution failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const role = '${{ inputs.executor_role }}';
            const title = `[Photo Objet collection] COLLECTION_FAILED/${role}`;
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, body,
            });
            else await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });

name: Photo Objet Sales Recover Missing Slot

# Retired: Photo sales now enter POS through the Super Admin Excel import.
on:
  workflow_dispatch:
    inputs:
      slot_date_hcm:
        description: 'Exact missing 22:00 HCM slot date (YYYY-MM-DD)'
        required: true

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Restrict manual recovery to main
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "${EVENT_NAME}" = 'workflow_dispatch' ]; then
            test "${SOURCE_REF}" = 'refs/heads/main'
          fi
  collect:
    if: ${{ false }}
    needs: validate
    uses: ./.github/workflows/photo_objet_sales_collect_runner.yml
    with:
      executor_role: backup
      trigger_cron: '30 17 * * *'
      slot_date_hcm: ${{ github.event.inputs.slot_date_hcm || '' }}
    secrets: inherit
